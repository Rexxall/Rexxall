<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Rex</title>
  <desc id="d">Rex: trained as a doctor, now building the tools his notes were missing. A heartbeat line turns into a row of commits, one dot for each tool.</desc>
  <rect width="1200" height="320" rx="28" fill="#16161A"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="72" y="132" font-size="72" font-weight="700" letter-spacing="-2" fill="#F2F2F5">Rex</text>
    <text x="74" y="186" font-size="28" fill="#F2F2F5">Trained as a doctor.</text>
    <text x="74" y="224" font-size="28" fill="#9A9AA3">Now I build the tools my notes were missing.</text>
    <text x="74" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9A9AA3">the tool proposes · you decide · undo always</text>
  </g>
  <g id="pulse-to-commits" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 168 H760 L772 156 L784 168 H800 L812 96 L828 222 L842 150 L852 168 H880 C892 168 896 146 912 146 C928 146 932 168 944 168 H1136" stroke="#9A9AA3" stroke-width="3"/>
    <circle cx="946" cy="168" r="9" fill="#7A5AF0" stroke="#16161A" stroke-width="3"/>
    <circle cx="972" cy="168" r="9" fill="#0A84FF" stroke="#16161A" stroke-width="3"/>
    <circle cx="998" cy="168" r="9" fill="#30B0C7" stroke="#16161A" stroke-width="3"/>
    <circle cx="1024" cy="168" r="9" fill="#FF375F" stroke="#16161A" stroke-width="3"/>
    <circle cx="1050" cy="168" r="9" fill="#FF9F0A" stroke="#16161A" stroke-width="3"/>
    <circle cx="1076" cy="168" r="9" fill="#34C759" stroke="#16161A" stroke-width="3"/>
    <circle cx="1102" cy="168" r="9" fill="#5E5CE6" stroke="#16161A" stroke-width="3"/>
    <circle cx="1128" cy="168" r="9" fill="#BF5AF2" stroke="#16161A" stroke-width="3"/>
  </g>
</svg>
