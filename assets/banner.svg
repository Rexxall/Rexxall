<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rexxall">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="#f3efe6"/>
  <rect width="1200" height="300" fill="#f3efe6" filter="url(#grain)"/>
  <!-- a page, drawn by hand -->
  <g fill="none" stroke="#2a2925" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 62 C 84 120, 90 180, 86 242 L 318 238 C 320 180, 314 118, 320 60 Z"/>
    <path d="M118 104 C 160 102, 200 106, 250 103"/>
    <path d="M118 134 C 170 131, 210 136, 282 132"/>
    <path d="M118 164 C 150 162, 190 166, 222 163"/>
    <path d="M118 194 C 180 191, 230 196, 268 193"/>
  </g>
  <!-- the one line taken back, in red -->
  <path d="M118 164 C 150 162, 190 166, 222 163" fill="none" stroke="#b8463a" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- a thread from the page to the words, in teal -->
  <path d="M318 165 C 380 160, 400 215, 470 150" fill="none" stroke="#2f7f86" stroke-width="2.2" stroke-dasharray="1 7" stroke-linecap="round"/>
  <circle cx="470" cy="150" r="5" fill="#2f7f86"/>
  <g font-family="Georgia, 'Songti SC', 'Hiragino Mincho ProN', serif" fill="#2a2925">
    <text x="500" y="128" font-size="54" font-weight="600" letter-spacing="1">Rexxall</text>
    <text x="502" y="172" font-size="22" fill="#5b574f">Tools for reading, notes, and the chores around them.</text>
    <text x="502" y="214" font-size="18" fill="#9b968b">读、记、整理 — 自己每天用的小工具。　読む・書く・整える。</text>
  </g>
  <g fill="none" stroke="#b8463a" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M1040 70 C 1060 60, 1080 90, 1100 76"/>
    <path d="M1030 240 C 1070 232, 1090 252, 1130 236"/>
  </g>
</svg>
